<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topology of Existence - 存在のトポロジー</title>
    
    <!--  Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- p5.js for 3D rendering and mathematics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030305; /* Cosmic dark background */
            font-family: 'Inter', sans-serif;
            color: #ffffff;
        }
        
        /* The canvas sits behind the UI overlay */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            cursor: grab;
        }
        
        #canvas-container:active {
            cursor: grabbing;
        }

        /* Custom styling for range sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
    </style>
</head>
<body class="antialiased selection:bg-white/30 text-white">

    <!-- Interactive UI Layer -->
    <div class="absolute top-0 left-0 w-full p-6 md:p-10 z-10 pointer-events-none flex flex-col md:flex-row justify-between items-start md:items-end h-full md:h-auto">
        
        <!-- Header / Concept -->
        <div class="pointer-events-auto max-w-lg mb-8 md:mb-0">
            <h1 class="text-3xl md:text-5xl font-extralight tracking-widest uppercase mb-2 drop-shadow-lg">
                Topology<br><span class="font-semibold opacity-80">of Existence</span>
            </h1>
            <p class="text-sm md:text-base text-gray-400 font-light tracking-wide leading-relaxed mt-4">
                "存在は運動を伴う。" <br>
                単振動（中心を通り抜ける往復）と、円運動（中心を空洞にする回転）。<br>
                双極の０と中心の有無が織りなす、存在を維持するための軌跡のシミュレーション。<br>
                <span class="text-cyan-400/70 text-xs mt-2 block">※画面をドラッグして視点を回転できます</span>
            </p>
        </div>

        <!-- Controls / Parameters -->
        <div class="pointer-events-auto bg-black/30 backdrop-blur-xl border border-white/10 p-6 rounded-2xl w-full max-w-sm shadow-2xl flex flex-col gap-6">
            
            <!-- Oscillation Speed Control (単振動) -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs tracking-widest uppercase text-gray-300">Harmonic Oscillation (単振動)</label>
                    <span id="oscVal" class="text-xs text-cyan-300 font-mono">1.0</span>
                </div>
                <input type="range" id="oscSpeed" min="0" max="5" step="0.1" value="2.1">
                <p class="text-[10px] text-gray-500 mt-1">極性の行き来の激しさ。中心を通過する速度。</p>
            </div>

            <!-- Rotation Speed Control (円運動) -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs tracking-widest uppercase text-gray-300">Circular Motion (円運動)</label>
                    <span id="rotVal" class="text-xs text-fuchsia-300 font-mono">1.0</span>
                </div>
                <input type="range" id="rotSpeed" min="0" max="5" step="0.1" value="1.3">
                <p class="text-[10px] text-gray-500 mt-1">空間（外郭）を維持するための回転速度。</p>
            </div>

            <!-- Base Radius Control (中心の空洞化) -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs tracking-widest uppercase text-gray-300">Center Void (中心の空洞)</label>
                    <span id="voidVal" class="text-xs text-amber-300 font-mono">0</span>
                </div>
                <input type="range" id="centerVoid" min="0" max="200" step="1" value="50">
                <p class="text-[10px] text-gray-500 mt-1">0の時、粒子は特異点（中心）を通過する。値を上げると中心を持たないトーラス（波）になる。</p>
            </div>
            
        </div>
    </div>

    <!-- p5.js Canvas Container -->
    <div id="canvas-container"></div>

    <script>
        let trails = [];      // 軌跡を保存する配列
        const MAX_TRAIL = 400; // 軌跡の長さ（存在の余韻）
        let globalTime = 0;   // 運動の経過時間

        // UI elements
        let oscSpeedSlider, rotSpeedSlider, centerVoidSlider;
        let oscValText, rotValText, voidValText;

        function setup() {
            let canvas = createCanvas(windowWidth, windowHeight, WEBGL);
            canvas.parent('canvas-container');
            
            // 色相・彩度・明度のモード（美しい発光を表現するため）
            colorMode(HSB, 360, 100, 100, 100);
            
            // UI要素の取得
            oscSpeedSlider = document.getElementById('oscSpeed');
            rotSpeedSlider = document.getElementById('rotSpeed');
            centerVoidSlider = document.getElementById('centerVoid');
            
            oscValText = document.getElementById('oscVal');
            rotValText = document.getElementById('rotVal');
            voidValText = document.getElementById('voidVal');

            // 描画モードの設定（加算合成で光るようにする）
            setAttributes('antialias', true);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        function draw() {
            // 背景の描画（深宇宙の表現）
            background(240, 60, 5, 100); // Dark desaturated blue/black
            
            // マウスによるカメラの回転を有効化
            orbitControl();
            
            // UIの値を取得
            let oscSpeed = parseFloat(oscSpeedSlider.value);
            let rotSpeed = parseFloat(rotSpeedSlider.value);
            let baseRadius = parseFloat(centerVoidSlider.value);
            
            // UIテキストの更新
            oscValText.innerText = oscSpeed.toFixed(1);
            rotValText.innerText = rotSpeed.toFixed(1);
            voidValText.innerText = baseRadius.toFixed(0);

            // 時間の進行
            globalTime += 0.02;

            // --- 哲学モデルの数式化 ---
            // 振幅（中心を行き来する距離の最大値）
            let amplitude = 150; 
            
            // 現在の半径 (動的に変動)
            // baseRadius(中心の空洞) + 単振動による行き来
            let currentRadius = baseRadius + amplitude * sin(globalTime * oscSpeed);
            
            // 3D座標の計算 (円運動と単振動の合成)
            // XとYで円運動を構成し、Zで高さ方向の振動を構成
            let x = currentRadius * cos(globalTime * rotSpeed);
            let y = currentRadius * sin(globalTime * rotSpeed);
            let z = amplitude * cos(globalTime * oscSpeed); // 3次元的なねじれ(黄金螺旋への布石)

            // 軌跡の記録
            trails.push({
                x: x, 
                y: y, 
                z: z, 
                time: globalTime
            });

            // 軌跡が長くなりすぎたら古いものを削除（忘却による存在の更新）
            if (trails.length > MAX_TRAIL) {
                trails.shift();
            }

            // --- 中心の描画（特異点・双極の0） ---
            push();
            noFill();
            // 中心が実体（0）か、空洞（波）かで表現を変える
            if (baseRadius === 0) {
                // 特異点としてのゼロ（引力を持つ点）
                stroke(0, 0, 100, 80);
                strokeWeight(8);
                point(0, 0, 0);
            } else {
                // 場としてのゼロ（中心を持たない格子、外郭を形成）
                stroke(200, 40, 100, 20);
                strokeWeight(1);
                sphere(baseRadius / 2, 8, 8); // 仮想の中心領域をうっすら描画
            }
            // Z軸（双極を貫く軸）をうっすら描画
            stroke(0, 0, 100, 10);
            strokeWeight(1);
            line(0, -300, 0, 0, 300, 0);
            pop();

            // --- 運動の軌跡（存在そのもの）の描画 ---
            push();
            noFill();
            strokeWeight(3);
            beginShape();
            for (let i = 0; i < trails.length; i++) {
                let p = trails[i];
                
                // 時間経過で消えていく表現（現在に近いほど不透明で明るい）
                let alpha = map(i, 0, trails.length, 0, 100);
                
                // 運動の速度や位置によって色（エネルギー状態）が変化する
                // hue(色相)を計算
                let hue = (p.time * 20 + map(i, 0, trails.length, 0, 60)) % 360;
                
                stroke(hue, 80, 100, alpha);
                vertex(p.x, p.y, p.z);
            }
            endShape();
            pop();

            // 現在の粒子（実体）を描画
            push();
            translate(x, y, z);
            noStroke();
            fill(0, 0, 100, 100); // Pure white glowing dot
            sphere(4);
            pop();
        }
    </script>
</body>
</html>
